[project]
name = "renovation-quotation-system"
version = "0.1.0"
description = "OOP renovation cost-estimation engine with rental yield, document export, Streamlit UI and PostgreSQL backend (portfolio demo)."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
